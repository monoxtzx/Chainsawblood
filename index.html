  normal: { name: 'ปกติ', hp: 6, bossHp: 1.0, bossSpd: 1.0 },

          for (const k of Object.keys(DIFFS)) { const o = this.data.prog[k]; if (!o) continue; for (const f of ['stars', 'best']) if (Array.isArray(o[f])) o[f] = P.map(i => o[f][i] || 0); }

  ArrowUp: ['up', 'jump'], KeyW: ['up', 'jump'],

  Space: ['jump', 'confirm'], KeyZ: ['jump', 'confirm'],

// ---- Hero: orange chainsaw pup ----
function drawPup(c, f = {}) {
  const O1 = '#f26b1d', O2 = '#c24510', O3 = '#ff9d52', K = '#1b1416', Wt = '#ffffff', G1 = '#d2d2da', G2 = '#8d8d98', G3 = '#55555f';
  const by = f.bob || 0, legs = f.legs || [0, 0, 0, 0], tooth = f.tooth || 0, lunge = f.lunge || 0;
  const X = lunge;
  // pull-cord handle on the back
  R(c, 1, 3 + by, 4, 2, K); R(c, 1, 5 + by, 2, 3, K); R(c, 3, 2 + by, 2, 1, K);
  // legs
  const lx = [5, 8, 12, 15];
  for (let i = 0; i < 4; i++) { R(c, lx[i] + X, 13 + by - legs[i], 2, 3 + legs[i] - (legs[i] > 1 ? 1 : 0), i % 2 ? O2 : O1); }
  // body
  R(c, 4 + X, 5 + by, 14, 8, O1); R(c, 5 + X, 4 + by, 12, 1, O1); R(c, 5 + X, 13 + by, 12, 1, O2);
  R(c, 4 + X, 11 + by, 14, 2, O2); R(c, 6 + X, 5 + by, 6, 1, O3);
  // head
  R(c, 14 + X, 4 + by, 6, 8, O1); R(c, 15 + X, 3 + by, 4, 1, O1); R(c, 19 + X, 6 + by, 2, 5, O1);
  R(c, 17 + X, 10 + by, 4, 2, O2); R(c, 19 + X, 9 + by, 2, 1, O2);
  // starter grip on top
  R(c, 8 + X, 1 + by, 6, 2, K); R(c, 8 + X, 3 + by, 2, 1, K); R(c, 12 + X, 3 + by, 2, 1, K);
  // saw bar
  R(c, 17 + X, 4 + by, 2, 4, G3);
  R(c, 19 + X, 2 + by, 7, 6, G1); R(c, 20 + X, 1 + by, 5, 1, G2); R(c, 20 + X, 8 + by, 5, 1, G2); R(c, 26 + X, 3 + by, 1, 4, G2);
  R(c, 20 + X, 4 + by, 5, 2, G2);
  for (let i = 0; i < 4; i++) { const tx = 20 + X + ((i * 2 + tooth) % 6); R(c, tx, by, 1, 1, G3); R(c, 25 - ((i * 2 + tooth) % 6) + X, 9 + by, 1, 1, G3); }
  R(c, 27 + X, 2 + ((tooth) % 5) + by, 1, 1, G3);
  // eye
  if (f.blink) { R(c, 14 + X, 7 + by, 4, 1, K); }
  else {
    R(c, 14 + X, 6 + by, 4, 4, Wt); R(c, 15 + X, 5 + by, 2, 1, Wt); R(c, 15 + X, 10 + by, 2, 1, Wt);
    R(c, 13 + X, 7 + by, 1, 2, Wt); R(c, 18 + X, 7 + by, 1, 2, Wt);
    R(c, 15 + X, 7 + by, 2, 2, K);
  }
}

// ---- Devil form (based on the reference art) ----
function drawDevil(c, f = {}) {
  const D1 = '#3b2b27', D2 = '#241a17', D3 = '#55403a', BK = '#101215', BK2 = '#2b3036', TE = '#f4f4f4', SC = '#d0665e', SC2 = '#9c3c38', K = '#0b0b0d';
  const ph = f.ph || 0, legA = f.legA || 0, slash = f.slash || 0, by = f.bob || 0;
  const ox = 12; // body offset inside 56px wide canvas
  // scarf tail flowing behind
  for (let i = 0; i < 16; i++) {
    const yy = 14 + by + Math.round(Math.sin(i * 0.45 + ph) * 2) - Math.floor(i / 5);
    R(c, ox + 12 - i, yy, 2, 3 - (i > 11 ? 1 : 0), i % 3 === 0 ? SC2 : SC);
  }
  // back blades (behind body)
  for (let i = 0; i < 16; i++) { R(c, ox + 8 - i * 0.45, 20 + i + by, 4, 2, BK); if (i % 2 === 0) R(c, ox + 6 - i * 0.45, 21 + i + by, 1, 1, BK2); }
  // legs
  R(c, ox + 13 - legA, 31 + by, 5, 9, D1); R(c, ox + 11 - legA, 39, 7, 3, D2);
  R(c, ox + 21 + legA, 31 + by, 5, 9, D1); R(c, ox + 21 + legA, 39, 8, 3, D2);
  R(c, ox + 14 - legA, 33 + by, 1, 5, D2); R(c, ox + 23 + legA, 33 + by, 1, 5, D2);
  // torso
  R(c, ox + 12, 16 + by, 16, 16, D1); R(c, ox + 10, 17 + by, 20, 8, D1);
  R(c, ox + 8, 16 + by, 5, 6, D1); R(c, ox + 27, 16 + by, 5, 6, D1);
  R(c, ox + 13, 18 + by, 5, 2, D3); R(c, ox + 21, 18 + by, 5, 2, D3);
  R(c, ox + 19, 18 + by, 1, 13, D2); R(c, ox + 14, 22 + by, 11, 1, D2); R(c, ox + 15, 26 + by, 9, 1, D2); R(c, ox + 16, 29 + by, 7, 1, D2);
  // back arm
  R(c, ox + 7, 21 + by, 4, 9, D2); R(c, ox + 6, 29 + by, 5, 4, D2);
  // head + saw
  R(c, ox + 18, 12 + by, 5, 4, D2);
  R(c, ox + 16, 4 + by, 9, 9, '#1c1818');
  R(c, ox + 17, 0 + by, 2, 5, K); R(c, ox + 20, 1 + by, 1, 3, K);
  R(c, ox + 22, 3 + by, 11, 5, BK); R(c, ox + 23, 4 + by, 9, 1, BK2);
  for (let i = 0; i < 6; i++) { R(c, ox + 23 + i * 2 + (ph * 2 | 0) % 2, 2 + by, 1, 1, BK); R(c, ox + 22 + i * 2, 8 + by, 1, 1, BK); }
  R(c, ox + 33, 4 + by, 1, 3, BK);
  // grin
  R(c, ox + 18, 9 + by, 8, 3, TE);
  for (let i = 0; i < 4; i++) R(c, ox + 19 + i * 2, 10 + by, 1, 2, '#8a8a8a');
  R(c, ox + 19, 12 + by, 6, 1, K);
  // scarf wrap + hanging tip
  R(c, ox + 14, 13 + by, 12, 4, SC); R(c, ox + 14, 16 + by, 12, 1, SC2);
  R(c, ox + 20, 17 + by, 3, 9, SC); R(c, ox + 21, 26 + by, 2, 2, SC2);
  // front arm + blade
  if (slash) {
    R(c, ox + 28, 18 + by, 8, 4, D1); R(c, ox + 35, 17 + by, 4, 5, D2);
    R(c, ox + 38, 17 + by, 16, 5, BK); R(c, ox + 39, 18 + by, 14, 1, BK2);
    for (let i = 0; i < 8; i++) { R(c, ox + 38 + i * 2 + (ph * 3 | 0) % 2, 16 + by, 1, 1, BK); R(c, ox + 39 + i * 2, 22 + by, 1, 1, BK); }
  } else {
    R(c, ox + 29, 21 + by, 4, 9, D1); R(c, ox + 28, 29 + by, 5, 4, D2);
    for (let i = 0; i < 16; i++) { R(c, ox + 30 + i * 0.5, 22 + i + by, 4, 2, BK); if (i % 2 === 0) R(c, ox + 34 + i * 0.5, 23 + i + by, 1, 1, BK2); }
  }
}

function drawCat(c, f = {}) {
  const A = '#9a9aa6', B = '#6a6a76', P = '#ffb0c0', K = '#16121a', Wt = '#fff';
  const lg = f.legs || 0, by = f.sit ? 2 : 0;
  // tail
  R(c, 0, 2 + (f.tail || 0), 2, 5, B); R(c, 1, 6, 2, 2, B);
  R(c, 2, 4 + by, 9, 5 - by, A); R(c, 3, 8, 2, 2 + (lg ? 0 : 1), B); R(c, 8, 8, 2, 2 + (lg ? 1 : 0), B);
  R(c, 8, 1 + by, 6, 5, A); R(c, 8, 0 + by, 1, 1, A); R(c, 13, 0 + by, 1, 1, A);
  R(c, 9, 0 + by, 1, 1, P); R(c, 12, 0 + by, 1, 1, P);
  R(c, 9, 2 + by, 1, 2, K); R(c, 12, 2 + by, 1, 2, K); R(c, 10, 4 + by, 2, 1, P);
  R(c, 3, 5 + by, 4, 1, B);
  if (f.mouth) R(c, 10, 5 + by, 2, 1, K);
  void Wt;
}

function drawEnemy(c, type, pal, f = {}) {
  const A = pal.a, B = pal.b, E = pal.c, K = '#0e0a0a', Wt = '#fff';
  if (type === 'walker') {
    const s = f.step || 0;
    R(c, 3, 2, 2, 3, B); R(c, 11, 2, 2, 3, B); // horns
    R(c, 2, 4, 12, 9, A); R(c, 3, 3, 10, 1, A); R(c, 2, 10, 12, 3, B);
    R(c, 4, 6, 3, 3, Wt); R(c, 9, 6, 3, 3, Wt); R(c, 5, 7, 2, 2, E); R(c, 10, 7, 2, 2, E);
    R(c, 5, 11, 6, 1, K); R(c, 6, 11, 1, 2, Wt); R(c, 9, 11, 1, 2, Wt);
    R(c, 3 + s, 13, 3, 3, B); R(c, 10 - s, 13, 3, 3, B);
  } else if (type === 'flyer') {
    const up = f.wing;
    if (up) { R(c, 0, 0, 5, 3, B); R(c, 13, 0, 5, 3, B); R(c, 2, 3, 3, 2, B); R(c, 13, 3, 3, 2, B); }
    else { R(c, 0, 6, 5, 3, B); R(c, 13, 6, 5, 3, B); R(c, 2, 4, 3, 2, B); R(c, 13, 4, 3, 2, B); }
    R(c, 5, 2, 8, 8, A); R(c, 6, 1, 6, 1, A); R(c, 6, 10, 6, 1, B);
    R(c, 6, 4, 6, 4, Wt); R(c, 8, 5, 2, 2, E); R(c, 8, 9, 2, 2, Wt);
  } else if (type === 'shooter') {
    R(c, 2, 4, 14, 11, A); R(c, 3, 3, 12, 1, A); R(c, 2, 12, 14, 3, B);

    R(c, 12, 8, 6, 4, K); R(c, 16, 7, 2, 6, B); // cannon mouth
    R(c, 3, 15, 4, 3, B); R(c, 11, 15, 4, 3, B);
  }
}

function drawZombie(c, v, f = {}) {

    { sh: '#8a6a4a', sh2: '#5e4630', pa: '#4a4a52', tie: null, hair: '#5a3a22' },        // jacket
  ][v];
  const st = f.step || 0, lg = f.lunge;
  const by = lg ? 1 : 0;
  // legs (shambling)
  R(c, 3 + (st === 1 ? 1 : 0), 14, 2, 7, outfit.pa); R(c, 6 - (st === 1 ? 1 : 0) + (lg ? 1 : 0), 14, 2, 7, outfit.pa);
  R(c, 2 + (st === 1 ? 1 : 0), 20, 3, 1, K); R(c, 6 - (st === 1 ? 1 : 0) + (lg ? 1 : 0), 20, 3, 1, K);
  // torso (torn shirt, blood)
  R(c, 2, 7 + by, 7, 8, outfit.sh); R(c, 2, 7 + by, 2, 8, outfit.sh2);

  R(c, 6, 11 + by, 2, 2, BL); R(c, 3, 13 + by, 1, 1, BL); R(c, 7, 14 + by, 2, 1, outfit.sh2); // tear
  // back arm reaching forward
  R(c, 6, 8 + by, 5 + (lg ? 2 : 0), 2, SK2);
  // head (tilted)
  R(c, 3, 1 + by, 6, 6, SK); R(c, 3, 0 + by, 6, 2, outfit.hair); R(c, 2, 1 + by, 2, 3, outfit.hair);
  R(c, 6, 3 + by, 2, 1, '#ffffff'); R(c, 7, 3 + by, 1, 1, '#c01010'); R(c, 4, 3 + by, 1, 1, '#ffffff');

  R(c, 6, 9 + by + (st ? 1 : 0), 6 + (lg ? 2 : 0), 2, SK); R(c, 11 + (lg ? 2 : 0), 9 + by + (st ? 1 : 0), 1, 1, SK2);
}

// ---- Tiles per theme ----
function buildTiles() {
  SPR.tiles = THEMES.map((t, ti) => {
    const mk = fn => { const c = mkCanvas(TS, TS); fn(c.getContext('2d')); return c; };
    const r = rng(99 + ti);
    const speck = (c, col, n) => { for (let i = 0; i < n; i++) R(c, Math.floor(r() * 16), Math.floor(r() * 16), 1, 1, col); };
    const fill = () => mk(c => {
      R(c, 0, 0, 16, 16, t.fill);
      if (t.id === 'city') { R(c, 0, 0, 16, 16, t.fill); R(c, 0, 15, 16, 1, t.fillD); R(c, 3, 4, 10, 8, '#6a8098'); R(c, 4, 5, 8, 6, '#8eb0cc'); R(c, 4, 5, 3, 2, '#d8ecf8'); R(c, 7, 5, 1, 6, '#6a8098'); R(c, 2, 12, 12, 1, '#a89c86'); R(c, 0, 0, 1, 16, '#e6ddcc'); }
      else if (t.id === 'factory') { R(c, 0, 0, 16, 16, t.fill); R(c, 0, 0, 16, 1, '#2e3c5e'); R(c, 3, 3, 10, 7, '#2a2a30'); R(c, 4, 4, 8, 5, r() < 0.7 ? '#ffd890' : '#6a7a9a'); R(c, 4, 4, 3, 1, '#fff2c8'); R(c, 0, 12, 16, 2, '#c4121a'); R(c, 0, 15, 16, 1, t.fillD); }
      else if (t.id === 'hotel') { for (let y = 0; y < 16; y += 4) { R(c, 0, y, 16, 1, t.fillD); } R(c, 7, 0, 1, 16, t.fillD); }
      else if (t.id === 'xmas') { for (let y = 0; y < 16; y += 4) { R(c, 0, y, 16, 1, t.fillD); R(c, (y / 4) % 2 ? 4 : 12, y, 1, 4, t.fillD); } }
      else { speck(c, t.fillD, 18); }
      if (t.id === 'hell') { R(c, 3, 8, 2, 2, '#3a7a44'); R(c, 10, 3, 2, 1, '#3a7a44'); }
      if (t.id === 'snow') { R(c, 0, 7, 16, 1, '#3a3c44'); R(c, 6, 0, 1, 7, '#3a3c44'); R(c, 11, 8, 1, 8, '#3a3c44'); R(c, 2, 10, 4, 1, '#8a5a3a'); R(c, 9, 3, 1, 3, '#8a5a3a'); }
    });
    const top = () => mk(c => {
      c.drawImage(fill(), 0, 0);
      if (t.id === 'city') { R(c, 0, 0, 16, 6, t.top); R(c, 0, 0, 16, 2, t.topHi); R(c, 0, 5, 16, 1, '#8e9298'); R(c, 3, 3, 1, 1, '#9a9ea4'); R(c, 11, 2, 2, 1, '#9a9ea4'); R(c, 0, 6, 16, 1, '#a8a092'); }

  const ch = () => { const o = ['CHASE1', 'CHASE2', 'CHASE3', 'CHASE4']; for (let i = 3; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return o; };
  const seq = ['START', pick(), pick(), secrets[0], pick(), pick(), pick(), 'CHECK',
    'ARENA', 'ARENA2', pick(), pick(), 'SPLIT1', 'SPLIT2', pick(), 'CLIMB', pick(), secrets[1], pick(), 'CHECK',
    'CHASE1', ...ch(), 'CHASE2', 'CHASE3', 'CHECK',
    pick(), pick(), 'MBOSS', 'MBOSS2', pick(), 'CLIMB', pick(), 'SPLIT3', pick(), 'SW', pick(), pick(), pick(), 'PRE'];
  // zones: arena = 2 chunks, chase = from first CHASE1 to the next CHECK, mini-boss = 2 chunks
  const zones = [];
  seq.forEach((k, i) => {
    if (k === 'ARENA') zones.push({ kind: 'arena', x0: i * 16 * TS, x1: (i + 2) * 16 * TS, c0: i * 16, c1: (i + 2) * 16 - 1 });
    if (k === 'MBOSS') zones.push({ kind: 'mboss', x0: i * 16 * TS, x1: (i + 2) * 16 * TS, c0: i * 16, c1: (i + 2) * 16 - 1 });
    if (k === 'CHASE1' && !zones.some(z => z.kind === 'chase')) { const e = seq.indexOf('CHECK', i); zones.push({ kind: 'chase', x0: i * 16 * TS, x1: e * 16 * TS + 40 }); }
  });
  const cols = seq.length * 16 + ARENA_W;
  const tiles = new Uint8Array(cols * MAP_H);
  const spawns = [];
  seq.forEach((key, ci) => {
    const rows = CH[key];
    for (let y = 0; y < MAP_H; y++) for (let x = 0; x < 16; x++) {
      const ch = rows[y][x], gx = ci * 16 + x, i = y * cols + gx;
      const px = gx * TS, py = y * TS;
      switch (ch) {
        case '#': tiles[i] = T_GROUND; break;
        case '=': tiles[i] = T_PLAT; break;
        case '^': tiles[i] = T_SPIKE; break;
        case 'B': tiles[i] = T_CRATE; break;
        case 'W': tiles[i] = T_WALL; break;
        case 'm': tiles[i] = T_SPRING; break;
        case 'c': spawns.push({ k: 'coin', x: px + 4, y: py + 3 }); break;
        case 'S': spawns.push({ k: 'bigcoin', x: px, y: py }); break;
        case 'h': spawns.push({ k: 'heart', x: px + 3, y: py + 4 }); break;
        case 'p': spawns.push({ k: 'orb', x: px + 3, y: py + 3 }); break;
        case 'C': spawns.push({ k: 'flag', x: px, y: py + 16 }); break;
        case 'e': case 'f': case 's': spawns.push({ k: ch === 'e' && theme.id === 'warehouse' ? 'zombie' : { e: 'walker', f: 'flyer', s: 'shooter' }[ch], x: px, y: py }); break;
        case 'z': if (theme.id === 'city' || theme.id === 'warehouse') spawns.push({ k: 'zombie', x: px, y: py }); break;
      }
    }
  });
  // hell: lava in pits
  if (false) for (let x = 0; x < cols; x++) if (!tiles[(MAP_H - 1) * cols + x] && !tiles[(MAP_H - 2) * cols + x]) tiles[(MAP_H - 1) * cols + x] = T_LAVA;
  // boss arena
  const a0 = seq.length * 16;
  for (let x = a0; x < cols; x++) { tiles[10 * cols + x] = T_GROUND; tiles[11 * cols + x] = T_GROUND; }
  for (let y = 0; y < 10; y++) tiles[y * cols + cols - 1] = T_GROUND;
  for (const px of [4, 5, 6, 15, 16, 17]) tiles[7 * cols + a0 + px] = T_PLAT;
  return { idx, theme, cols, tiles, spawns, zones, arenaCol: a0, arenaX: (a0 + 1) * TS, width: cols * TS,
    coinsTotal: spawns.filter(s => s.k === 'coin').length };
}

class Level {
  constructor(idx) {
    Object.assign(this, buildLevel(idx));
    this.tileSet = SPR.tiles[idx];
    this.bg = SPR.bg[idx];
  }
  get(tx, ty) {
    if (tx < 0 || tx >= this.cols) return T_GROUND;
    if (ty < 0 || ty >= MAP_H) return T_EMPTY;
    return this.tiles[ty * this.cols + tx];
  }
  set(tx, ty, v) { if (tx >= 0 && tx < this.cols && ty >= 0 && ty < MAP_H) this.tiles[ty * this.cols + tx] = v; }
  at(px, py) { return this.get(Math.floor(px / TS), Math.floor(py / TS)); }
  solidAt(px, py) { return isSolid(this.at(px, py)); }
  drawBg(ctx, camX, t, skyHook) {
    const bg = this.bg, A = bg.alt ? clamp((camX - this.width * 0.3) / (this.width * 0.3), 0, 1) : 0;
    ctx.drawImage(bg.sky, 0, 0);
    const sc = bg.scroll, spd = sc ? (1 - (bg.alt ? clamp((camX - this.width * 0.3) / (this.width * 0.3), 0, 1) : 0)) * (this.arenaStop ? 0 : 1) : 0;
    this.scrollT = (this.scrollT || 0) + spd;
    const lay = (img, k, yo) => { const extra = sc ? this.scrollT * (img === bg.far ? sc.far : img === bg.mid ? sc.mid : img === bg.near ? sc.near : 0) : 0; const off = Math.floor(camX * k + extra) % img.width; ctx.drawImage(img, -off, yo); ctx.drawImage(img, img.width - off, yo); };
    if (A > 0) { ctx.globalAlpha = A; ctx.drawImage(bg.alt.sky, 0, 0); ctx.globalAlpha = 1; }
    if (skyHook) skyHook(ctx);
    const BK = this.bossK || 0;
    if (bg.boss && BK >= 1) { ctx.drawImage(bg.boss.sky, 0, 0); lay(bg.boss.far, 0.12, 0); lay(bg.boss.near, 0.4, 0); return; }
    if (bg.boss && BK > 0) {
      lay(bg.far, 0.12, 0); lay(bg.near, 0.4, 0);
      ctx.globalAlpha = BK; ctx.drawImage(bg.boss.sky, 0, 0); lay(bg.boss.far, 0.12, 0); lay(bg.boss.near, 0.4, 0); ctx.globalAlpha = 1; return;
    }
    if (bg.alt) {
      ctx.globalAlpha = 1 - A; lay(bg.far, 0.12, 0); if (bg.mid) lay(bg.mid, 0.25, 0); lay(bg.near, 0.4, 0);
      ctx.globalAlpha = A; if (A > 0) { lay(bg.alt.far, 0.12, 0); lay(bg.alt.near, 0.4, 0); }
      ctx.globalAlpha = 1; return;
    }
    if (bg.blinks) { lay(bg.far, 0.12, 0); if (bg.mid) lay(bg.mid, 0.25, 0); for (const b of bg.blinks) { const on = b.col ? (Math.sin(t * 0.3 + b.x) > -0.85 || (t % 200) > 6) : t % 50 < 25; if (!on) continue; const off = Math.floor(camX * 0.25) % (W * 2); for (const o of [0, W * 2]) { const x = b.x - off + o, gl = b.glow || 4; if (x > -20 && x < W + 20) { ctx.globalAlpha = 0.3; R(ctx, x - gl, b.y - gl, gl * 2 + 1, gl * 2 + 1, b.col || '#ff2020'); ctx.globalAlpha = 1; R(ctx, x - 1, b.y - 1, 3, 3, b.col || '#ff4a3a'); } } } lay(bg.near, 0.4, 0); return; }
    if (this.bg.clouds) { const img = this.bg.clouds, off = Math.floor(camX * 0.05 + t * 0.08) % img.width; ctx.drawImage(img, -off, 0); ctx.drawImage(img, img.width - off, 0); }
    lay(this.bg.far, 0.12, 0); if (this.bg.mid) lay(this.bg.mid, 0.25, 0); lay(this.bg.near, 0.4, 0);
  }
  drawTiles(ctx, camX, camY, t) {
    const ts = this.tileSet, x0 = Math.floor(camX / TS), x1 = Math.ceil((camX + W) / TS);
    for (let tx = x0; tx <= x1; tx++) { // pits read as dark holes, not background
      if (tx < 0 || tx >= this.cols || this.get(tx, MAP_H - 1)) continue;
      const sx = tx * TS - camX, top = (MAP_H - 2) * TS - camY;
      for (let i = 0; i < 32; i += 2) { ctx.globalAlpha = Math.min(1, 0.15 + i / 26); R(ctx, sx, top + i, TS, 2, '#05040a'); }
      ctx.globalAlpha = 1;
    }
    for (let ty = 0; ty < MAP_H; ty++) for (let tx = x0; tx <= x1; tx++) {
      const v = this.get(tx, ty); if (!v) continue;
      const sx = tx * TS - camX, sy = ty * TS - camY;
      if (tx < 0 || tx >= this.cols) continue;
      let img;
      switch (v) {
        case T_GROUND: img = isSolid(this.get(tx, ty - 1)) || this.get(tx, ty - 1) === T_SPIKE ? ts.fill : ts.top; break;
        case T_PLAT: img = ts.plat; break;
        case T_SPIKE: img = ts.spike; break;
        case T_CRATE: img = ts.crate; break;
        case T_WALL: img = ts.wall; break;
        case T_LAVA: img = ts.lava[Math.floor(t / 10 + tx) % 3]; break;
        case T_SPRING: img = ts.spring[this.springT && this.springT[tx] > 0 ? 1 : 0]; break;
        case T_GATE: img = ts.gate; break;
      }
      if (img) ctx.drawImage(img, sx, sy);
    }
  }
}

function groundYAt(g, x) { const tx = Math.floor(x / TS); for (let ty = 2; ty < MAP_H; ty++) { const t = g.lvl.get(tx, ty); if (isSolid(t) || t === T_PLAT) return ty * TS; } return null; }

  if (t % 10 >= 6) return; R(ctx, x - 5, y - 6, 11, 12, '#14100e'); R(ctx, x - 4, y - 5, 9, 10, col);
  if (glyph === '!') { R(ctx, x - 1, y - 3, 2, 4, '#fff'); R(ctx, x - 1, y + 2, 2, 2, '#fff'); }
  else if (glyph === 'v') { R(ctx, x - 1, y - 4, 2, 5, '#fff'); R(ctx, x - 3, y, 6, 1, '#fff'); R(ctx, x - 2, y + 1, 4, 1, '#fff'); R(ctx, x - 1, y + 2, 2, 1, '#fff'); }

}
function stageUpdate(g) {

  if (g.phase !== 'run') { if (!g.stageOff) { g.stageOff = true; g.darkTarget = 0; g.tilt = 0; } if (g.mstate.chain) { g.mstate.chain.q.frozen = false; g.mstate.chain = null; } if (g.mstate.sitHold) { g.mstate.sitHold = 0; for (const q of g.players) q.frozen = false; } g.hazards = []; g.plats = g.plats.filter(p => p.kind !== 'car'); return; }
  for (const pl of g.plats) { if (pl.ref && pl.ref.life <= pl.ref.t) pl.dead = true; if (pl.ref) { pl.x = pl.ref.x + 2; pl.y = pl.ref.y - 1; pl.dx = pl.ref.vx; } }

    for (const pl of g.plats) { const foot = q.y + q.h; if (q.vy >= 0 && q.x + q.w > pl.x + 1 && q.x < pl.x + pl.w - 1 && foot >= pl.y - 1 && foot <= pl.y + 7 + q.vy) { q.y = pl.y - q.h; q.vy = 0; q.onGround = true; q.coyote = 7; q.x += pl.dx || 0; } } }

    }
  }

  for (const d of g.props) { if (d.flash > 0) d.flash--; if (d.kind === 'stall' && !d.broken) for (const q of g.players) { const ab = q.attackBox(); if (ab && overlap(ab, d) && !(d.cd > 0)) { d.cd = 12; d.hp--; d.flash = 4; AU.sfx('hit'); if (d.hp <= 0) { d.broken = true; AU.sfx('break'); g.shake(6); for (let k = 0; k < 16; k++) g.particle(d.x + rand(0, d.w), d.y + rand(0, d.h), rand(-2, 2), rand(-3, -0.5), 34, ['#8a5a2a', '#c4121a', '#ffffff', '#ffd080'][k % 4], 2, 0.2); for (let k = 0; k < 5; k++) g.pickups.push({ k: 'coin', x: d.x + k * 5, y: d.y - 6 - (k % 2) * 8, w: 8, h: 10, t: 0 }); } } } if (d.cd > 0) d.cd--; }
}

// ---------- Anime-style character renderer ----------
// One parametric drawer for every human character. u = 1 -> in-game sprite (~32px tall),
// u = 2 -> detailed portrait (~64px tall, extra highlights). Local coords: x right (facing right),
// y up from the feet (negative = up), so a figure stands on y = 0.
function animeH(c, u, ox, oy) {
  const X = x => ox + x * u, Y = y => oy + y * u;
  return { u, X, Y, c,
    r: (x, y, w, h, col) => R(c, X(x), Y(y), w * u, h * u, col),
    e: (x, y, rx, ry, col) => ell(c, X(x), Y(y), rx * u, ry * u, col),
    p: (pts, col) => poly(c, pts.map(([x, y]) => [X(x), Y(y)]), col),
    t: (a, b, w, col) => thick(c, [X(a[0]), Y(a[1])], [X(b[0]), Y(b[1])], Math.max(1, Math.round(w * u)), col),
    l: (x0, y0, x1, y1, col) => u === 1 ? line(c, X(x0), Y(y0), X(x1), Y(y1), col) : thick(c, [X(x0), Y(y0)], [X(x1), Y(y1)], u, col),
    px: (x, y, col) => R(c, X(x), Y(y), u, u, col),
    hi: (x, y, col, w = 1, h = 1) => { if (u > 1) R(c, X(x), Y(y), w, h, col); }, // portrait-only detail (real pixels)
  };
}

function animePose(f) {
  const pose = f.pose || 'idle', st = f.step || 0;
  const o = { pose, bob: f.bob ? 1 : 0, fb: [-2.5, 0], ff: [2.5, 0], hf: [3.5, -11], hb: [-3.5, -11], lean: 0 };
  switch (pose) {
    case 'run': { const s = [4, 1, -3, 1][st]; o.ff = [s, s > 2 ? -2 : 0]; o.fb = [-s, s < -2 ? -2 : 0]; o.hf = [2 - s * 0.8, -12]; o.hb = [-2 + s * 0.8, -12]; o.lean = 1; break; }
    case 'jump': o.fb = [-3, -2]; o.ff = [3, -4]; o.hf = [5, -18]; o.hb = [-5, -17]; break;
    case 'dash': case 'flykick': o.fb = [-7, -2]; o.ff = [5, -3]; o.hf = [8, -16]; o.hb = [-7, -15]; o.lean = 2; break;
    case 'kick': o.fb = [-3, 0]; o.ff = [11, -9]; o.hf = [3, -17]; o.hb = [-5, -15]; break;
    case 'atk': case 'punch': o.fb = [-4.5, 0]; o.ff = [4.5, 0]; o.hf = [10, -17]; o.hb = [-4, -14]; o.lean = 1; break;
    case 'atk2': o.fb = [-4.5, 0]; o.ff = [4.5, 0]; o.hf = [8, -12]; o.hb = [-3, -13]; break;
    case 'wind': o.fb = [-3.5, 0]; o.ff = [3, 0]; o.hf = [-2, -25]; o.hb = [-4, -14]; break;
    case 'windup': o.fb = [-3.5, 0]; o.ff = [3, 0]; o.hf = [-1, -28]; o.hb = [-1, -27]; break;
    case 'smash': o.fb = [-5, 0]; o.ff = [5, 0]; o.hf = [9, -12]; o.hb = [7, -13]; o.lean = 2; break;
    case 'over': o.fb = [-3.5, 0]; o.ff = [3.5, 0]; o.hf = [1.5, -31]; o.hb = [0, -30]; break;
    case 'pull': o.hf = [1.5, -17]; o.hb = [-3, -13]; break;
    case 'pullOut': o.hf = [1.5 + (f.ext || 8), -19]; o.hb = [-3, -13]; o.lean = -1; break;
  }
  return o;
}

// A = look spec, f = frame options. Draws the full figure.
function drawAnime(c, A, f, u, ox, oy) {
  const o = animePose(f); if (A.poseMod) A.poseMod(o, f); const L = animeH(c, u, ox, oy), U = animeH(c, u, ox + o.lean * u * 0.5, oy + o.bob * u), K = '#14100e';
  const sk = A.sk, sk2 = A.sk2;
  if (A.back) A.back(U, o, f);
  if (A.hairBack) A.hairBack(U, o, f);
  // --- back arm ---
  const arm = (H, sh, hand, sleeve, skin) => { const el = [(sh[0] + hand[0]) / 2 - 0.8, (sh[1] + hand[1]) / 2 + 0.6]; H.t(sh, el, 2.6, sleeve); if (A.rolled) { H.t(el, hand, 2, skin); H.e(el[0], el[1], 1.5, 1.3, sleeve); H.e(hand[0], hand[1], 1.2, 1.2, skin); return; } H.t(el, hand, A.bareArms ? 2 : 2.4, A.bareArms ? skin : (A.cuffs ? sleeve : sleeve)); if (!A.bareArms) H.t([hand[0] - (hand[0] - el[0]) * 0.25, hand[1] - (hand[1] - el[1]) * 0.25], hand, 2, skin); H.e(hand[0], hand[1], 1.2, 1.2, skin); };
  arm(U, [-3, -20], [o.hb[0] - o.lean * 0.5, o.hb[1] - o.bob], A.sleeve2 || A.sleeve, sk2);
  // --- legs ---
  const leg = (hip, foot, col, col2, shoe, back) => {
    const kn = [(hip[0] + foot[0]) / 2 + 1, (hip[1] + foot[1]) / 2 - (foot[1] < -1 ? 1.5 : 0)];
    L.t(hip, kn, 3, col); L.t(kn, [foot[0], foot[1] - 1.5], 2.6, col2);
    L.r(foot[0] - 1.5, foot[1] - 2, 4.5, 2, shoe); if (A.sole) L.r(foot[0] - 1.5, foot[1] - 0.6, 4.5, 0.6, A.sole);

// ---------- Small fx entities ----------
class Cat {
  constructor(x, y, vx) { this.x = x; this.y = y; this.vx = vx; this.vy = -3.2; this.w = 12; this.h = 9; this.t = 0; this.sit = false; this.face = sign(vx); }
  update(g) {
    this.t++;
    if (!this.sit) {
      this.vy = Math.min(4, this.vy + 0.2); moveBody(this, g.lvl);
      if (this.onGround) { this.vx *= 0.9; if (this.t > 70) { this.sit = true; this.vx = 0; AU.sfx('meow'); g.popText('เหมียว~', this.x + 6, this.y - 10, '#ffd0e0', 120); } }
      if (this.hitWall) this.vx = -this.vx;
    } else if (this.t % 150 === 0) { AU.sfx('meow'); g.popText('เหมียว~', this.x + 6, this.y - 10, '#ffd0e0', 90); }
    if (this.sit && this.t % 30 === 0) g.particle(this.x + 6, this.y - 2, rand(-0.3, 0.3), -0.6, 50, '#ff8ab0', 2, 0, 'heart');
  }
  draw(ctx, cx, cy, g) {
    const spr = this.sit ? SPR.cat.sit : SPR.cat.walk[Math.floor(this.t / 6) % 2];
    drawSpr(ctx, spr, this.x + this.w / 2 - cx, this.y + this.h - cy + 1, this.face);
  }
}

function buildThemedEnemies() {
  THEMES.forEach((t, i) => {
    const D = ET[t.id]; if (!D) return;
    const set = SPR.enemy[i];
    if (D.walker) set.walker = ['walk', 'walk2', 'wind', 'dash'].map((p, k) => makeSprite(18, 20, c => D.walker.draw(c, { pose: p === 'walk2' ? 'walk' : p, step: k === 1 ? 1 : 0 })));
    if (D.flyer) set.flyer = [0, 1].map(k => makeSprite(18, 14, c => D.flyer.draw(c, { wing: k, blink: k })));
    if (D.shooter) set.shooter = [0, 1].map(k => makeSprite(18, 20, c => D.shooter.draw(c, { fire: k })));
    set.themed = true;
  });
}

function trimCanvas(c) { // crop transparent borders
  const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data; let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (d[(y * c.width + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return c; const o = mkCanvas(x1 - x0 + 1, y1 - y0 + 1); o.getContext('2d').drawImage(c, -x0, -y0); return o;
}
function drawStoryScene(ctx, scene, t) {

  if (scene === 'city') {
    ctx.drawImage(SPR.bg[1].alt.sky, 0, 0); ctx.drawImage(SPR.bg[1].alt.far, -(t * 0.3 % 640), 0); ctx.drawImage(SPR.bg[1].alt.near, -(t * 0.6 % 640), 0);
    for (let i = 0; i < 5; i++) { const x = (i * 71 + t * 0.4) % W, y = 40 + (i * 23) % 50; R(ctx, x, y, 2, 2, '#ff2020'); R(ctx, x + 4, y, 2, 2, '#ff2020'); } // eyes in the dark
  } else if (scene === 'bosses') {
    R(ctx, 0, 0, W, H, '#0a0408');
    if (!SPR.introBosses) { // snapshot each main-story boss once (all 8, in stage order)
      SPR.introBosses = [];
      for (let i = 0; i < 8; i++) { try { const st = STAGES[i], sess = new Session(i, { chars: [0] }), B = new st.boss(sess); if ('human' in B) B.human = false; B.set(st.first); B.state = st.first; B.t = 20; SPR.introBosses.push(trimCanvas(B.snapshot().c)); } catch (e) { SPR.introBosses.push(null); } }
    }
    SPR.introBosses.forEach((c, i) => { if (!c) return; const row = i < 4 ? 0 : 1, col = i % 4, k = Math.min(1, Math.max(0, (t - i * 10) / 20)), sc = Math.min(1, 62 / c.height, 74 / c.width);
      const w = c.width * sc, h = c.height * sc, cx = 44 + col * 78, by = row ? 134 : 68;
      ctx.globalAlpha = k; ctx.drawImage(c, Math.round(cx - w / 2), Math.round(by - h), Math.round(w), Math.round(h)); ctx.globalAlpha = 1; });
  } else if (scene === 'team') {
    ctx.drawImage(bg0.sky, 0, 0); ctx.drawImage(bg0.far, 0, 0); if (bg0.mid) ctx.drawImage(bg0.mid, 0, 0);
    R(ctx, 0, 150, W, 30, '#5a5c64'); R(ctx, 0, 150, W, 2, '#8a8c94');
    CHARACTERS.forEach((ch, i) => { const S = ch.spr(), k = Math.min(1, Math.max(0, (t - i * 8) / 14)); ctx.globalAlpha = k; drawSpr(ctx, S.idle[Math.floor((t + i * 7) / 30) % S.idle.length], 28 + i * 44, 151, 1); ctx.globalAlpha = 1; });
  } else {
    R(ctx, 0, 0, W, H, '#120206');
    for (let i = 0; i < 40; i++) { const a = i / 40 * 6.28 + t * 0.01; ctx.strokeStyle = i % 3 ? '#2a0a10' : '#ff3a1a'; ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * 30, H / 2 + Math.sin(a) * 30); ctx.lineTo(W / 2 + Math.cos(a) * 200, H / 2 + Math.sin(a) * 200); ctx.stroke(); }
    const S = SPR.pup; ctx.drawImage(S.run[Math.floor(t / 5) % 4], W / 2 - 60, 70, S.run[0].width * 4, S.run[0].height * 4);
  }
}

function findPair(a, b) { for (const p of STORY.pairs) { if (p[0] === a && p[1] === b) return { first: a, l1: p[2], l2: p[3], end: p[4] }; if (p[0] === b && p[1] === a) return { first: b, l1: p[2], l2: p[3], end: p[4] }; } return null; }
function chLine(ch, text) { return { who: ch.name, text, col: ch.cutCol || '#ffd0a0', side: 0, ch }; }
function makeStageDialog(si, ch, ch2) {
  const lines = [{ who: '— ' + (STAGES[si].label || '') + ' —', text: STORY.stageNarr[si] || '……', col: '#bbbbbb', side: 1 }];
  const own = c => (STORY.stageLine[c.id] || [])[si] || STORY.reply[c.id] || '……';
  if (!ch2) { lines.push(chLine(ch, own(ch))); return { i: 0, t: 0, lines }; }
  if (ch.id === ch2.id) { lines.push(chLine(ch, own(ch)), Object.assign(chLine(ch2, '…ทำไมมีฉันสองคน'), { side: 1, who: ch2.name + ' (P2)' })); return { i: 0, t: 0, lines }; }
  const pr = findPair(ch.id, ch2.id);
  if (pr && (si === 0 || si >= 7)) { const A = pr.first === ch.id ? ch : ch2, B = A === ch ? ch2 : ch; lines.push(Object.assign(chLine(A, pr.l1), { side: A === ch2 ? 1 : 0 }), Object.assign(chLine(B, pr.l2), { side: B === ch2 ? 1 : 0 })); }
  else lines.push(chLine(ch, own(ch)), Object.assign(chLine(ch2, (STORY.duo[ch2.id] || ['……'])[si % 3]), { side: 1, who: ch2.name + ' (P2)' }));
  for (const L of lines) if (L.ch === ch2 && ch2 !== ch && !/\(P2\)$/.test(L.who)) L.who = ch2.name + ' (P2)';
  return { i: 0, t: 0, lines };
}
function coopEndingLines(c1, c2) {
  const e1 = STORY.ending[c1.id] || [], e2 = STORY.ending[c2.id] || [];
  if (c1.id === c2.id) return [e1[0] || '', STORY.sameEnd];
  const pr = findPair(c1.id, c2.id);
  return [e1[0] || '', e2[0] || '', pr ? pr.end : STORY.pairEndGeneric[(c1.id.length + c2.id.length) % STORY.pairEndGeneric.length]];
}

function partyEndingLines(chars) {
  const n = chars.length, lines = chars.map(c => (STORY.ending[c.id] || [])[0] || '').filter((l, i, a) => l && a.indexOf(l) === i);
  if (chars.every(c => c.id === chars[0].id)) return lines.concat([STORY.sameParty]);

const UI = {
  ctx: null, s: 1, ox: 0, oy: 0, hits: [],
  thai: /[฀-๿]/,
  font(size, s) { return this.thai.test(s) ? `600 ${Math.round(size * 1.35 * this.s)}px Kanit, "Noto Sans Thai", Tahoma, sans-serif` : `${Math.round(size * this.s)}px "Press Start 2P", "Courier New", monospace`; },
  text(s, x, y, o = {}) {
    const c = this.ctx, size = o.size || 8;
    c.font = this.font(size, s); c.textAlign = o.align || 'left'; c.textBaseline = 'middle';
    const px = this.ox + x * this.s, py = this.oy + y * this.s;
    c.globalAlpha = o.alpha == null ? 1 : o.alpha;
    if (o.shadow !== false) { c.fillStyle = o.shadowColor || '#000'; c.fillText(s, px + Math.max(1, size * 0.18 * this.s), py + Math.max(1, size * 0.18 * this.s)); }
    if (o.stroke) { c.lineWidth = o.stroke * this.s; c.strokeStyle = o.strokeColor || '#000'; c.strokeText(s, px, py); }
    c.fillStyle = o.color || '#fff'; c.fillText(s, px, py);
    c.globalAlpha = 1;
  },
  width(s, size = 8) { this.ctx.font = this.font(size, s); return this.ctx.measureText(s).width / this.s; },
  rect(x, y, w, h, color, alpha = 1) { const c = this.ctx; c.globalAlpha = alpha; c.fillStyle = color; c.fillRect(this.ox + x * this.s, this.oy + y * this.s, w * this.s, h * this.s); c.globalAlpha = 1; },
  frame(x, y, w, h, color = '#c4121a') { this.rect(x, y, w, 1, color); this.rect(x, y + h - 1, w, 1, color); this.rect(x, y, 1, h, color); this.rect(x + w - 1, y, 1, h, color); },
  // Vertical menu; returns nothing, items carry their own actions.
  menu(items, sel, cx, y0, gap = 16, o = {}) {
    items.forEach((it, i) => {
      const on = i === sel, label = typeof it.label === 'function' ? it.label() : it.label;
      const y = y0 + i * gap, w = Math.max(110, this.width(label, 8) + 24);
      if (on) { this.rect(cx - w / 2, y - 7, w, 14, '#c4121a', 0.85); this.text('▶', cx - w / 2 + 6, y, { size: 6, color: '#fff', shadow: false }); }
      else this.rect(cx - w / 2, y - 7, w, 14, '#000', 0.45);
      this.text(label, cx, y, { align: 'center', color: it.disabled ? '#777' : on ? '#fff' : '#e8d8d0', size: 8 });
      this.hits.push({ x: cx - w / 2, y: y - 7, w, h: 14, fn: () => { GAME.menuSel = i; GAME.activate(it); } });
    });
  },
};

function menuNav(items) {
  const n = items.length;
  if (IN.pressed.up) { GAME.menuSel = (GAME.menuSel + n - 1) % n; AU.sfx('select'); }
  if (IN.pressed.down) { GAME.menuSel = (GAME.menuSel + 1) % n; AU.sfx('select'); }
  const it = items[GAME.menuSel];
  if (it && (IN.pressed.left || IN.pressed.right) && it.side) { it.side(IN.pressed.left ? -1 : 1); AU.sfx('select'); }
  if (it && (IN.pressed.confirm || IN.pressed.attack || (IN.pressed.jump && !IN.held.up))) GAME.activate(it);
}

function pickChar(i) {
  if (!CHARACTERS[i]) { AU.sfx('deny'); return; }
  AU.sfx('confirm');
  if (GAME.coop) {
    if (GAME.pickFor === 1 || !GAME.chars) { GAME.chars = []; SAVE.data.char = i; }
    GAME.chars.push(i);
    if (GAME.chars.length < GAME.nP) { GAME.pickFor = GAME.chars.length + 1; GAME.menuSel = i; SAVE.save(); return; }
  } else { GAME.chars = [i]; SAVE.data.char = i; }
  SAVE.save();
  if (GAME.flow === 'rush' || GAME.flow === 'endless') { startMode(GAME.flow); return; }
  GAME.go('select', Math.min(STAGES.length - 1, SAVE.prog.unlocked - 1));
}
function partyHpK(n) { return 1 + 0.6 * (Math.max(1, n) - 1); } // 2p ×1.6 · 3p ×2.2 · 4p ×2.8
const PCOL = ['#ff8a5a', '#8ab4ff', '#7aff8a', '#ffd040'];
function cycleNP(d) { GAME.nP = ((GAME.nP || 2) - 1 + d + 4) % 4 + 1; }
function startPick(flow) { GAME.coop = GAME.nP > 1 && flow !== 'story'; GAME.flow = flow; GAME.pickFor = 1; GAME.chars = null; GAME.go('chars', charIndex()); }
function seeTeam(players) { const k = players.map(q => q.ch.id).join(','); GAME.seenTeam = GAME.seenTeam || {}; if (GAME.seenTeam[k]) return false; GAME.seenTeam[k] = true; return true; }
function wrapText(text, size, maxW) { // word-wrap; Thai has no spaces, so long runs break between characters (never before a combining mark)
  const lines = []; let cur = '';
  const fits = t => UI.width(t, size) <= maxW, comb = c => /[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/.test(c);
  for (const word of text.split(/(?<= )/)) {
    if (fits(cur + word)) { cur += word; continue; }
    if (cur.trim()) { lines.push(cur.trimEnd()); cur = ''; }
    if (fits(word)) { cur = word; continue; }
    for (const c of word) { if (!fits(cur + c) && cur && !comb(c)) { lines.push(cur); cur = ''; } cur += c; }
  }
  if (cur.trim()) lines.push(cur.trimEnd());
  return lines;
}
function fmtTime(fr) { const s = Math.floor(fr / 60); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function bossPool() { return STAGES.map((s, i) => i).filter(i => !STAGES[i].secret || SAVE.prog.unlocked >= STAGES.length); }
function startMode(mode) { AU.sfx('confirm'); if (mode === 'rush') { const L = bossPool(); g = new Session(L[0], { mode: 'rush', rushList: L, rushPos: 0, coop: GAME.coop, chars: GAME.chars }); } else { g = new Session(randi(0, LAST_MAIN), { mode: 'endless', coop: GAME.coop, chars: GAME.chars }); } GAME.go('play'); }
function cycleDiff(d) { const ks = Object.keys(DIFFS); SAVE.data.diff = ks[(ks.indexOf(SAVE.data.diff) + d + ks.length) % ks.length]; SAVE.save(); }
function toggleRumble() { SAVE.data.rumble = SAVE.data.rumble === false; AU.sfx('select'); SAVE.save(); if (SAVE.data.rumble) rumble(0.7, 0.7, 250); }
function openSettings(from, sel) { if (GAME.stateT < 2) return; GAME.setFrom = from; GAME.setSel = sel; GAME.go('settings', 0); }
function closeSettings() { GAME.go(GAME.setFrom || 'title', GAME.setSel || 0); }
function applyBtnScale() { const r = document.documentElement.style; r.setProperty('--tsl', SAVE.data.btnScaleL || 1); r.setProperty('--tsr', SAVE.data.btnScaleR || 1); }
function btnScale(side, d, wrap) { // 70%..160% in 10% steps; confirm/tap cycles back to 70% after 160%
  const k = 'btnScale' + side; let v = Math.round((SAVE.data[k] || 1) * 10) + d;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cw = Math.floor(innerWidth * dpr), ch = Math.floor(innerHeight * dpr);
  if (main.width !== cw || main.height !== ch) { main.width = cw; main.height = ch; }
  main.style.width = innerWidth + 'px'; main.style.height = innerHeight + 'px';
  let s = Math.min(cw / W, ch / H); if (s > 2) s = Math.floor(s * 2) / 2;
  UI.s = s; UI.ox = Math.floor((cw - W * s) / 2); UI.oy = Math.floor((ch - H * s) / 2);
  UI.dpr = dpr;
}
function render() {

  if (tl) { mctx.save(); mctx.translate(UI.ox + W * UI.s / 2, UI.oy + H * UI.s / 2); mctx.rotate(tl); mctx.scale(1.08, 1.08); mctx.drawImage(low, -W * UI.s / 2, -H * UI.s / 2, W * UI.s, H * UI.s); mctx.restore(); }

}
let acc = 0, last = 0;
function frame(ts) {

  let steps = 0;
  while (acc >= 1000 / 60 && steps < 4) {
    IN.update(); for (const s of INPUT_SETS) s.update(); GAME.t++; GAME.stateT++;
    SCREENS[GAME.state].update();
    acc -= 1000 / 60; steps++;
  }
  if (steps === 4) acc = 0;
  render();
  requestAnimationFrame(frame);
}

function boot() {
  main = document.getElementById('game'); mctx = main.getContext('2d'); UI.ctx = mctx;
  SAVE.load(); AU.muted = SAVE.data.muted;
  buildSprites(); IN.init(); resize();
  addEventListener('resize', resize);
  IN.onFirstInput = () => { AU.init(); AU.setMuted(SAVE.data.muted); };
  main.addEventListener('pointerdown', e => {
    IN.first(); AU.init();
    const r = main.getBoundingClientRect(), px = (e.clientX - r.left) * (main.width / r.width), py = (e.clientY - r.top) * (main.height / r.height);
    const gx = (px - UI.ox) / UI.s, gy = (py - UI.oy) / UI.s;
    for (let i = UI.hits.length - 1; i >= 0; i--) { const h = UI.hits[i]; if (gx >= h.x && gx <= h.x + h.w && gy >= h.y && gy <= h.y + h.h) { h.fn(); break; } }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && GAME.state === 'play') GAME.go('pause'); });
  setupTouch();
  AU.play('title');
  if (QS.has('level')) { const n = clamp(parseInt(QS.get('level'), 10) - 1, 0, STAGES.length - 1); if (QS.has('debug')) SAVE.prog.unlocked = STAGES.length; g = new Session(n); GAME.go('play'); }
  if (document.fonts && document.fonts.load) { document.fonts.load('16px "Press Start 2P"').catch(() => {}); document.fonts.load('600 16px Kanit').catch(() => {}); }
  requestAnimationFrame(frame);
}

function setupTouch() {
  const wrap = document.getElementById('touch'); if (!wrap) return;
  const coarse = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window || QS.has('touch');
  if (!coarse) return;
  wrap.hidden = false;
  applyBtnScale();
  // Android app (its WebView tags the user agent), iPhone/iPad (Safari or home screen) and home-screen web apps get the analog stick; everything else keeps the ◀ ▶ ▼ buttons
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (/ChainsawBloodApp/.test(navigator.userAgent) || isIOS || navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches) || QS.has('stick')) { for (const id of ['tl', 'tr', 'td']) { const el = document.getElementById(id); if (el) el.remove(); } document.getElementById('stick').hidden = false;
    wrap.classList.add('xbox'); TOUCH_XBOX = true; // phone layout: A/B/X/Y diamond like an Xbox pad
    for (const [id, t] of [['tj', 'A'], ['ta', 'X'], ['tx', 'B'], ['tv', 'Y']]) { const el = document.getElementById(id); if (el) el.textContent = t; } }
  else { const st = document.getElementById('stick'); if (st) st.remove(); }
  wrap.querySelectorAll('[data-a]').forEach(b => {
    const acts = b.dataset.a.split(',');
    let pid = null;
    const off = () => { if (pid !== null) TOUCH_ACTIVE.delete(pid); pid = null; b.classList.remove('on'); acts.forEach(a => IN.setTouch(a, false)); };
    const on = e => { e.preventDefault(); AU.init(); if (pid !== null) off(); pid = e.pointerId; TOUCH_ACTIVE.set(pid, off); b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch (_) {} acts.forEach(a => IN.setTouch(a, true)); };
    b.addEventListener('pointerdown', on);
    b.addEventListener('lostpointercapture', e => { if (e.pointerId === pid) off(); });
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  if (document.getElementById('stick')) setupStick();
  // release fingers wherever they are lifted (even off the button), and whenever the game loses focus
  const lift = e => { const f = TOUCH_ACTIVE.get(e.pointerId); if (f) f(); TOUCH_DOWN.delete(e.pointerId); };
  addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') TOUCH_DOWN.add(e.pointerId); }, true);
  addEventListener('pointerup', lift, true); addEventListener('pointercancel', lift, true);
  addEventListener('blur', releaseTouch); addEventListener('pagehide', releaseTouch);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseTouch(); });
  let lastState = GAME.state;
  setInterval(() => {
    const pad = IN.lastDevice === 'pad'; if (pad && !wrap.classList.contains('padmode')) releaseTouch(); wrap.classList.toggle('padmode', pad); // playing with a controller hides the on-screen buttons
    if (GAME.state !== lastState) { if (GAME.state === 'pause') releaseTouch(); lastState = GAME.state; }
    if (!TOUCH_DOWN.size && (TOUCH_ACTIVE.size || ACTIONS.some(a => IN.touch[a]))) releaseTouch(); // safety net: nothing touches the screen, so nothing may stay held
  }, 120);
  addEventListener('pointerdown', e => { if (e.pointerType === 'touch' && IN.lastDevice === 'pad') { IN.lastDevice = 'touch'; wrap.classList.remove('padmode'); } }, true);
}
// Analog-style movement stick: the knob follows the finger inside the ring; tilt maps to left/right/up/down.
let TOUCH_XBOX = false;
const TOUCH_ACTIVE = new Map(), TOUCH_DOWN = new Set(); // pointerId -> release fn; fingers currently on the screen
function releaseTouch() { const ld = IN.lastDevice; for (const f of [...TOUCH_ACTIVE.values()]) f(); TOUCH_ACTIVE.clear(); TOUCH_DOWN.clear(); IN.touch = {}; IN.lastDevice = ld; }
function setupStick() {
  const st = document.getElementById('stick'), base = document.getElementById('sbase'), knob = document.getElementById('knob'); if (!st) return;
  let pid = null; const held = { left: false, right: false, up: false, down: false };
  const set = (a, v) => { if (held[a] !== v) { held[a] = v; IN.setTouch(a, v); } };
  const move = e => {
    const r = base.getBoundingClientRect(), R = r.width / 2, cx = r.left + R, cy = r.top + R;
    let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy), lim = R * 0.62; if (d > lim) { dx = dx / d * lim; dy = dy / d * lim; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const nx = dx / lim, ny = dy / lim;
    set('left', nx < -0.32); set('right', nx > 0.32); set('down', ny > 0.5); set('up', ny < -0.55);
  };
  const release = () => { if (pid !== null) TOUCH_ACTIVE.delete(pid); pid = null; st.classList.remove('on'); knob.style.transform = ''; for (const a of Object.keys(held)) { held[a] = false; IN.setTouch(a, false); } };
  st.addEventListener('pointerdown', e => { e.preventDefault(); if (pid !== null) release(); /* a stale finger never blocks a new one */ pid = e.pointerId; TOUCH_ACTIVE.set(pid, release); AU.init(); st.classList.add('on'); try { st.setPointerCapture(pid); } catch (_) {} move(e); });
  addEventListener('pointermove', e => { if (e.pointerId === pid) { e.preventDefault(); move(e); } }, { passive: false }); // keep tracking even if capture failed
  st.addEventListener('lostpointercapture', e => { if (e.pointerId === pid) release(); });
  st.addEventListener('contextmenu', e => e.preventDefault());
}

window.addEventListener('load', boot);

</script>
